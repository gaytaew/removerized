name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: removerized-production
  cancel-in-progress: true

env:
  SITE_URL: https://removerized.77-110-115-65.sslip.io:8443

jobs:
  deploy:
    name: Build and deploy release
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: yarn

      - name: Install dependencies
        shell: bash
        run: |
          corepack enable
          yarn install --immutable

      - name: Build standalone application
        shell: bash
        run: NEXT_PUBLIC_SITE_URL="$SITE_URL" yarn build

      - name: Package release
        shell: bash
        run: |
          mkdir -p .release/.next
          cp -R .next/standalone/. .release/
          cp -R .next/static .release/.next/static
          cp -R public .release/public
          tar -czf "removerized-${GITHUB_SHA}-${GITHUB_RUN_ID}.tar.gz" -C .release .

      - name: Validate deployment configuration
        shell: bash
        run: |
          test -n "$SERVER_HOST"
          test -n "$SERVER_USER"
          test -n "$SERVER_SSH_KEY"
          test -n "$SERVER_KNOWN_HOSTS"

      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Upload release
        shell: bash
        run: |
          scp -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            "removerized-${GITHUB_SHA}-${GITHUB_RUN_ID}.tar.gz" \
            "$SERVER_USER@$SERVER_HOST:/opt/removerized/incoming/"

      - name: Activate release with rollback
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=30 \
            "$SERVER_USER@$SERVER_HOST" \
            "bash -s -- '$GITHUB_SHA' '$GITHUB_RUN_ID'" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          release_sha="$1"
          run_id="$2"
          base_dir=/opt/removerized
          release_id="${release_sha}-${run_id}"
          archive_path="${base_dir}/incoming/removerized-${release_id}.tar.gz"
          release_dir="${base_dir}/releases/${release_id}"
          next_link="${base_dir}/.current-${release_id}"
          previous_release="$(readlink -f "${base_dir}/current" 2>/dev/null || true)"

          install -d -o www-data -g www-data -m 755 "$release_dir"
          tar -xzf "$archive_path" -C "$release_dir"
          chown -R www-data:www-data "$release_dir"

          ln -s "$release_dir" "$next_link"
          mv -Tf "$next_link" "${base_dir}/current"
          systemctl restart removerized.service

          healthy=false
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:3333/ >/dev/null; then
              healthy=true
              break
            fi
            sleep 2
          done

          if [ "$healthy" != true ]; then
            journalctl -u removerized.service -n 200 --no-pager
            if [ -n "$previous_release" ] && [ -d "$previous_release" ]; then
              rollback_link="${base_dir}/.rollback-${release_id}"
              ln -s "$previous_release" "$rollback_link"
              mv -Tf "$rollback_link" "${base_dir}/current"
              systemctl restart removerized.service
            fi
            exit 1
          fi

          rm -f "$archive_path"
          REMOTE_SCRIPT

      - name: Verify public endpoint
        shell: bash
        run: |
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --max-time 10 "$SITE_URL/" >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          exit 1
